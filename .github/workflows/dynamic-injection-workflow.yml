name: Dynamic README injection
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: readme-update
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update README with latest blog posts
        id: posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://gervisbermudez.github.io/site/feed.xml"
          max_post_count: 4
          skip_commit: true
          enable_keepalive: false
          retry_count: 3

      - name: Inject Office quote
        id: inject
        run: node index.js

      - name: Commit and push
        if: always() && steps.inject.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "[Automated] README updated with blog posts and Office quote"
          git push

      - name: Fail if blog posts were not updated
        if: always() && steps.posts.outcome == 'failure'
        run: exit 1
